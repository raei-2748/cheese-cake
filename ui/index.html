<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)">
<script>try{const t=localStorage.getItem("hsc-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="description" content="Stacky: study timer, tasks, calendar, habits and assessment tracking for the HSC.">
<title>Stacky</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314181f'/%3E%3Cpath d='M8 11l8-4 8 4-8 4zM8 16l8 4 8-4M8 21l8 4 8-4' fill='none' stroke='%23ffe94a' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="style.css?v=__V__">
<script type="module" src="app.js?v=__V__"></script>
<script type="module" src="motion.js?v=__V__"></script>
</head>
<body>
<a href="#main" class="skip">Skip to workspace</a>
<div class="shell"><div class="scrim" data-action="menu" aria-hidden="true"></div>
<aside class="sidebar">
  <a class="brand" href="#dash">Stacky</a>
  <nav id="nav" aria-label="Workspace"></nav>
  <div class="rail-bottom"><button type="button" class="rail-link" data-action="settings">Backup &amp; settings</button><button type="button" class="rail-link" id="theme-toggle">Theme: auto</button></div>
</aside>
<div class="work">
<header class="topbar"><button type="button" class="menu-btn" data-action="menu" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><span class="breadcrumb"><strong id="section-label">Today</strong></span><input id="search" type="search" class="search" placeholder="Search tasks  /" aria-label="Search tasks" autocomplete="off"><a id="mini-timer" class="mini-timer" href="#focus" hidden></a><span id="save-status" class="save-status" role="status">Opening workspace…</span></header>
<div class="panes"><main id="main" tabindex="-1"><p class="loading">Opening your stack…</p></main><aside id="detail" class="detail" aria-label="Task details" hidden></aside></div>
</div>
</div>
<div id="fs-timer" class="fs-timer" role="dialog" aria-modal="true" aria-label="Full-screen study timer" tabindex="-1" hidden></div>
<dialog id="editor" aria-labelledby="editor-title"></dialog>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
