<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="description" content="HSC Stack: tasks, calendar, focus timer, habits and assessment tracking for the 2027 HSC.">
<title>HSC Stack</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314181f'/%3E%3Cpath d='M8 11l8-4 8 4-8 4zM8 16l8 4 8-4M8 21l8 4 8-4' fill='none' stroke='%23ffe94a' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap">

<script type="module" src="app.js"></script>
</head>
<body>
<a href="#main" class="skip">Skip to workspace</a>
<div class="shell"><div class="scrim" data-action="menu" aria-hidden="true"></div>
<aside class="sidebar">
  <a class="brand" href="#today"><span class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="m3 8 9-4.5L21 8l-9 4.5z"/><path d="m3 12.5 9 4.5 9-4.5M3 17l9 4.5 9-4.5"/></svg></span><span>HSC Stack<small>CLASS OF 2027</small></span></a>
  <nav id="nav" aria-label="Workspace"></nav>
  <div class="rail-bottom"><span class="goal-icon">↗</span><div><strong>Top 10 overall</strong><small>School assessment goal</small></div><button type="button" class="rail-settings" data-action="settings" aria-label="Backup and settings" title="Backup &amp; settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M4.9 4.9 7 7m10 10 2.1 2.1M2 12h3m14 0h3M4.9 19.1 7 17m10-10 2.1-2.1"/></svg></button></div>
</aside>
<div class="work">
<header class="topbar"><button type="button" class="menu-btn" data-action="menu" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><span class="breadcrumb">HSC Stack <span>/</span> <strong id="section-label">Today</strong></span><input id="search" type="search" class="search" placeholder="Search tasks  /" aria-label="Search tasks" autocomplete="off"><a id="mini-timer" class="mini-timer" href="#focus" hidden></a><span id="save-status" class="save-status" role="status">Opening workspace…</span></header>
<div class="panes"><main id="main" tabindex="-1"><p class="loading">Opening your stack…</p></main><aside id="detail" class="detail" aria-label="Task details" hidden></aside></div>
</div>
</div>
<dialog id="editor" aria-labelledby="editor-title"></dialog>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
