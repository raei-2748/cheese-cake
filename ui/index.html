<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<script>try{const t=localStorage.getItem("hsc-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;const k=localStorage.getItem("stacky-hl");if(k&&k!=="yellow")document.documentElement.dataset.hl=k}catch(e){}
try{const s=JSON.parse(localStorage.getItem("stacky-side"))||{};if(s.w)document.documentElement.style.setProperty("--side-w",s.w+"px");if(s.collapsed)document.documentElement.dataset.side="collapsed"}catch(e){}</script>
<meta name="description" content="Stacky: study timer, tasks, calendar, habits and assessment tracking for the HSC.">
<title>Stacky</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314181f'/%3E%3Cpath d='M8 11l8-4 8 4-8 4zM8 16l8 4 8-4M8 21l8 4 8-4' fill='none' stroke='%23ffe94a' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=__V__">
<script type="module" src="app.js?v=__V__"></script>
<script type="module" src="motion.js?v=__V__"></script>
</head>
<body>
<a href="#main" class="skip">Skip to workspace</a>
<div class="shell"><div class="scrim" data-action="menu" aria-hidden="true"></div>
<aside class="sidebar">
  <a class="brand" href="#dash"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#1f1f1f"/><path d="M8 11l8-4 8 4-8 4zM8 16l8 4 8-4M8 21l8 4 8-4" fill="none" stroke="#ffe94a" stroke-width="2" stroke-linejoin="round"/></svg>Stacky</a>
  <button type="button" class="side-collapse" id="side-collapse" aria-label="Collapse sidebar" title="Collapse sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 6l-6 6 6 6M18 6l-6 6 6 6"/></svg></button>
  <div class="side-grip" id="side-grip" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" tabindex="0" title="Drag to resize. Double-click to reset."></div>
  <nav id="nav" aria-label="Workspace"></nav>
  <div class="rail-bottom"><button type="button" class="rail-link" data-action="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></button><button type="button" class="rail-link" id="theme-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg><span>Theme: auto</span></button></div>
</aside>
<div class="work">
<header class="topbar"><button type="button" class="menu-btn" data-action="menu" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><span class="breadcrumb"><a href="#dash" class="crumb-root">Stacky</a><span class="crumb-sep">/</span><strong id="section-label">Overview</strong></span><input id="search" type="search" class="search" placeholder="Search tasks  /" aria-label="Search tasks" autocomplete="off"><a id="mini-timer" class="mini-timer" href="#focus" hidden></a><span id="save-status" class="save-status" role="status">Opening workspace…</span></header>
<div class="panes"><main id="main" tabindex="-1"><p class="loading">Opening your stack…</p></main><aside id="detail" class="detail" aria-label="Task details" hidden></aside></div>
</div>
</div>
<div id="fs-timer" class="fs-timer" role="dialog" aria-modal="true" aria-label="Full-screen study timer" tabindex="-1" hidden></div>
<dialog id="editor" aria-labelledby="editor-title"></dialog>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
